plugins {
    id 'java'
    id 'war'
    id 'fish.payara.micro-gradle-plugin' version '2.1.0'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.11.0'
}

sourceCompatibility = '21'
targetCompatibility = '21'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly('jakarta.servlet:jakarta.servlet-api:6.1.0')
    compileOnly('org.glassfish.jersey.containers:jersey-container-servlet:4.0.0-M1')
    compileOnly('org.glassfish.jersey.media:jersey-media-json-jackson:4.0.0-M1')
    compileOnly('org.glassfish.jersey.inject:jersey-cdi2-se:4.0.0-M1')
    compileOnly('org.jboss.weld.se:weld-se-core:6.0.0.Beta4')

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

payaraMicro {
    payaraVersion = '6.2024.5'
    deployWar = true
    useUberJar = true
    contextRoot = "/"
}

test {
    useJUnitPlatform()
}