<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <meta charset="UTF-8">
    <title>Книги</title>


    <style>
        .print-only {
            display: none;
        }

        td {
            padding: 0;
            margin: 0;
        }

        tr {
            padding: 0;
            margin: 0;
        }

        table {
            padding: 0;
            margin: 0;
        }

        @media print {

            @page {
                padding: 3px;
            }

            .no-print {
                display: none !important;
            }

            .print-only {
                display: block;

            }

            .page-header, .page-header-space {
                height: 50px;
            }

            .page-footer, .page-footer-space {
                height: 50px;

            }

            .page-footer {
                position: fixed;
                text-align: center;
                bottom: 0;
                width: 100%;
                /*border-top: 1px solid black; /*for demo */
                /* background: yellow; for demo */
            }

            .page-header {
                position: fixed;
                text-align: right;
                top: 0;
                width: 100%;
                /*border-bottom: 1px solid black; /* for demo */
                /* background: yellow; for demo */
            }

        }
    </style>


</head>
<body>
<div layout:fragment="content">
    <h1>Книги</h1>

    <div class="row">

        <div class="panel-body">
            <div class="row">
                <div class="col-lg-1">
                    <a href="/add_book" data-toggle="modal" class="btn btn-primary"
                       th:if="${#authorization.expression('hasAuthority(''Менеджер'')')}">
                        New Book
                    </a>
                </div>
                <form th:action="@{/book}">
                    <div class="col-lg-4">
                        <input type="text" name="keyword" class="form-control search-bar" th:value="${keyword}">
                        <button type="submit" class="btn btn-success">Search</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-12">
            <section class="panel">

                <div id="printArea">

                    <div class="page-header print-only">
                        Звіт: Книги
                        <br/>
                    </div>

                    <div class="page-footer print-only">
                        Літературний сад
                    </div>

                    <table style="width: 100%;">
                        <thead>
                        <tr>
                            <td>
                                <!--place holder for the fixed-position header-->
                                <div class="page-header-space print-only"></div>
                            </td>
                        </tr>
                        </thead>

                        <tbody>
                        <tr>
                            <td style="width: 100%">

                                <div class="print-body">
                                    <h2 id="printTitle" class="print-only" style="text-align: center">Звіт по
                                        книгах</h2>


                                    <div class="print-only" style="text-align: left; margin-bottom: 10px;">
                                        <span th:if="${keyword != null && keyword != ''}" id="keyISBNprint"
                                              th:text="'Пошук за: '+${keyword}"></span><br/>
                                    </div>


                                    <table class="table table-striped table-advance table-hover"
                                           style="width: 100%; margin-bottom:0">
                                        <tbody>
                                        <tr>
                                            <th><i class="glyphicon-bookmark"></i>isbn</th>
                                            <th><i class="icon_image"></i> photo</th>
                                            <th><i class="icon_book"></i> name</th>
                                            <th><i class="icon_user"></i> author</th>
                                            <th><i class="icon_genius"></i> genre</th>
                                            <th><i class="icon_currency"></i> price</th>
                                            <th class="no-print"><i class="icon_cogs"></i> actions</th>
                                        </tr>
                                        <tr th:each="book : ${books}">
                                            <td th:text="${book.ISBN}"></td>
                                            <td>
                                                <img th:if="${book.image != null}"
                                                     th:src="@{${book.image}}"
                                                     style="width: 50px; height: 50px; object-fit: cover;"/>
                                            </td>
                                            <td th:text="${book.name}"></td>
                                            <td>
                              <span th:each="author, iterStat : ${book.authors}"
                                    th:text="${author.full_name} + (${iterStat.last} ? '' : ', ')"></span>
                                            </td>
                                            <td>
                            <span th:each="genre, iterStat : ${book.genres}"
                                  th:text="${genre.name} + (${iterStat.last} ? '' : ', ')"></span>
                                            </td>
                                            <td th:text="${book.price}"></td>
                                            <td class="no-print">
                                                <div class="btn-group">
                                                    <a class="btn btn-primary"
                                                       th:href="@{'/book_info/' + ${book.ISBN}}"><i
                                                            class="icon_info"></i></a>
                                                    <a class="btn btn-success"
                                                       th:if="${#authorization.expression('hasAuthority(''Менеджер'')')}"
                                                       th:href="@{'/edit_book/' + ${book.ISBN}}"><i
                                                            class="icon_pencil-edit"></i></a>
                                                    <a class="btn btn-danger"
                                                       th:if="${#authorization.expression('hasAuthority(''Менеджер'')')}"
                                                       th:disabled="${book.quantity > 0}"
                                                       onclick="return confirm('sure?')"
                                                       th:href="@{'/book/delete/' + ${book.ISBN}}"><i
                                                            class="icon_trash"></i></a>
                                                </div>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>

                                </div>

                            </td>
                        </tr>
                        </tbody>

                        <tfoot>
                        <tr>
                            <td>
                                <!--place holder for the fixed-position footer-->
                                <div class="page-footer-space print-only"></div>
                            </td>
                        </tr>
                        </tfoot>

                    </table>
                </div>


            </section>
        </div>
    </div>
</div>
</body>

</html>
